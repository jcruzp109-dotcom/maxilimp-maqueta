<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Maxilimp — Maqueta</title>
<style>
  :root{--bg:#0f1114;--ink:#f3f4f2;--soft:rgba(243,244,242,.62);--line:rgba(243,244,242,.14)}
  *{box-sizing:border-box;margin:0}
  body{min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:560px;text-align:center}
  p.k{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
  h1{margin:18px 0 14px;font-size:clamp(40px,9vw,76px);font-weight:500;letter-spacing:-.03em}
  p.d{color:var(--soft);line-height:1.5}
  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
</style>
</head>
<body>
<main>
  <p class="k">Maqueta privada · En desarrollo</p>
  <h1>Maxilimp</h1>
  <p class="d">Aquí se irá construyendo la propuesta del nuevo sitio. Esta página es de prueba y se reemplaza con la maqueta.</p>
  <footer>Desarrollado por Antonio Pompa</footer>
</main>
</body>
</html>
